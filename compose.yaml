services:
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:8.19.8'
    container_name: es-local
    environment:
      # Single node configuration
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      # OPTIMIZE: Disable Machine Learning (saves huge RAM/CPU on boot)
      - xpack.ml.enabled=false
      # OPTIMIZE: Disable Watcher (alerting) if not used
      - xpack.watcher.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - '9200:9200'

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: 'docker.elastic.co/kibana/kibana:8.19.8'
    container_name: 'kibana-local'
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy

  app:
    build: .
    container_name: course-search-api
    ports:
      - '8080:8080'
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  elasticsearch_data:
    driver: local

networks:
  elastic:
    driver: bridge